# Bounded 3-hop oracle rerun with a single-GPU self-hosted LLM.
dataset:
  reviews_file: data/Books_rating.csv
  metadata_file: data/books_data.csv
  p0_audit: data/temporal_amazon_books_2014/p0_temporal_audit.json
  p1_ledger: data/temporal_amazon_books_2014/p1_item_route_ledger.jsonl
  p1_packet_sources: data/temporal_amazon_books_2014/p1_packet_sources.jsonl
  p1_eval_events: data/temporal_amazon_books_2014/p1_eval_events.jsonl
  p1_manifest: data/temporal_amazon_books_2014/p1_manifest.json

p1:
  pilot_user_hash_modulus: 48
  pilot_user_hash_remainder: 0

p3:
  run_id: p3_oracle_selfhost_qwen3_4b_2507_v2_hnv
  structural_smoke_manifest: data/temporal_amazon_books_2014/p3v2_structural_smoke-hnv.json
  ledger: data/temporal_amazon_books_2014/p3v2_item_route_ledger-hnv.jsonl
  preflight_manifest: data/temporal_amazon_books_2014/p3v2_preflight_manifest-hnv.json
  base_prepared: data/temporal_amazon_books_2014/p2_v2_prepared.json
  prepared: data/temporal_amazon_books_2014/p3v2_selfhost_prepared-hnv.json
  attempts: data/temporal_amazon_books_2014/p3v2_selfhost_attempts-hnv.jsonl
  calls: data/temporal_amazon_books_2014/p3v2_selfhost_calls-hnv.jsonl
  llm_smoke_manifest: data/temporal_amazon_books_2014/p3v2_selfhost_smoke_manifest-hnv.json
  metrics: data/temporal_amazon_books_2014/p3v2_selfhost_metrics-hnv.json
  manifest: data/temporal_amazon_books_2014/p3v2_selfhost_manifest-hnv.json
  peers1_per_anchor: 16
  bridge_items_per_peer1: 16
  peers2_per_bridge: 8
  endpoint_items_per_peer2: 8
  max_witness_paths_per_item: 8
  workers: 1
  bootstrap_resamples: 10000
  bootstrap_seed: 20260921

self_host:
  model: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  dtype: bfloat16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.22
  hard_memory_fraction: 0.25
  max_model_len: 4096
  seed: 20260921
  temperature: 0.0
  max_output_tokens:
    packet: 384
    stage_r: 384
    rerank: 96

experiment:
  arms: [local, oracle_two_hop, oracle_three_hop]
  evaluation_events: 100
  semantic_packet_sources: 560
  overlay_packet_cap: 2
  support_threshold: 2
  smoke_events: 20
  smoke_base_packet_sources: 20
  retry_reserve: 40
  hard_generation_cap: 1000
