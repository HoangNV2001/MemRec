# M3 — SFT warm start for LM_Mem (RL_PLAN.md §M3, hyper-parameters from §6.1/§6.2)
#
# Rejection-sampling distillation: gpt-4o-mini writes 8 M_collab per training
# user, the M2 reward keeps the best, and the policy is fine-tuned on that one.
# §M3 calls this the project's safe point — a 4B matching a prompted baseline at
# much lower inference cost is rung 3 of the fallback ladder (§2.5.4) and a
# complete thesis on its own, independent of whether M4 works.

policy:
  # Same checkpoint as the frozen reward ranker, by decision on 2026-08-10.
  # Worth being explicit about the consequence: reward model and eval model are
  # then the same weights, which removes the main internal guard against reward
  # hacking. The ranker-swap test of §9.1 / M5 Priority 1 stops being a nice
  # extra and becomes the only evidence the gain is real.
  model_name: Qwen/Qwen3.5-4B
  dtype: bfloat16
  # Qwen3.5 is a reasoning model. Its template opens a <think> block, and a
  # policy that reasons before writing memory blows past §6.2's 384-token
  # completion budget, inflates completion_length_mean (the §9.3 hacking alarm),
  # and undercuts the contribution itself — tokens per query is the axis this
  # thesis competes on. Handled centrally in src.rl.policy.chat_text.
  enable_thinking: false
  max_prompt_tokens: 2048
  max_completion_tokens: 512      # SFT targets measure ~276 tokens (median)

lora:                              # §6.2
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear

train:                             # §M3: 2 epochs, lr 1e-5
  epochs: 2
  learning_rate: 1.0e-5
  per_device_batch_size: 1
  gradient_accumulation_steps: 8   # effective batch 8
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  weight_decay: 0.0
  gradient_checkpointing: true     # 4B + LoRA + ~1700-token sequences on 24 GB
  logging_steps: 10
  save_strategy: epoch
  seed: 42                         # §10.7

data:
  train_file: data/rl/m3_sft_books.jsonl
  # Loss on the completion only. Training on the prompt too would spend most of
  # the gradient on reproducing the neighbour table, which is given at inference
  # time and is ~85% of every sequence.
  mask_prompt: true

output_dir: checkpoints/rl/sft_books
