# Single preregistered graph intervention on the locked Books 700/200 cohort.
# All other full-MemRec settings inherit the real-LLM baseline unchanged.
inherit: configs/memrec_instructrec-books_dev700.yaml
memrec:
  k: 16
  tau_tokens: 1800
  mix_min_users: 4
  mix_min_items: 6
  n_facets: 7
  temperature: 0.0
  max_tokens: 4000
  pruner:
    mode: graph_walk3
    checkpoint: null
  reranker_mode: llm
  upstream_empty_facets_prompt: true
  write:
    fanout_cap: 8
    max_tokens: 4000
