# Pre-registered one-step directed transition evidence in full MemRec Stage-R.
# All model, candidate, and 700/200 cohort settings are inherited. The MemRec
# block is repeated in full because load_config replaces nested dictionaries.
inherit: configs/memrec_instructrec-books_dev700.yaml
memrec:
  k: 16
  tau_tokens: 1800
  mix_min_users: 4
  mix_min_items: 6
  n_facets: 7
  temperature: 0.0
  max_tokens: 4000
  pruner:
    mode: transition_one_step
    checkpoint: null
  reranker_mode: llm
  upstream_empty_facets_prompt: true
  write:
    fanout_cap: 8
    max_tokens: 4000
