# MemRec ablation: w/o Collaborative Read (Stage-R disabled)
# Same as memrec_instructrec-books_1k.yaml, except Stage-R (collaborative memory
# retrieval/synthesis) is skipped. Stage-W still runs during warmup, so each
# user's own memory (M_u) is still built — only the *collaborative* facet
# synthesis is removed. Used as the "MemRec w/o Collab. Read" row in M0 (RL_PLAN.md).

model: memrec_agent
dataset: instructrec-books
seed: 42

# Evaluation settings (1k sampled users) — must match the main 1k config exactly
n_eval_candidates: 10
n_eval_users: 1000
eval_user_list: data/eval_user_samples/eval_user_sample_1k_instructrec-books.json

topk: [1, 3, 5, 10]
metrics: ['Hit', 'NDCG']

# Eval feedback mode
eval_feedback: gt  # gt | random | none

# Training settings (warmup still builds M_u via Stage-W)
warmup:
  enabled: true
  rounds: 1

# LLM/Provider settings
llm_model: "gpt-4o-mini"
api_version: "2024-08-01-preview"

provider:
  name: openai
  model: gpt-4o-mini
  endpoint: ${ENV:OPENAI_API_BASE}
  api_key: ${ENV:OPENAI_API_KEY}

memrec:
  k: 16
  tau_tokens: 1800
  mix_min_users: 4
  mix_min_items: 6
  n_facets: 7
  temperature: 0.0
  max_tokens: 4000

  # Ablation: disable Stage-R (collaborative memory retrieval/synthesis)
  enable_stage_r: false
  # enable_stage_w only gates the EVAL-loop write (src/train/trainer_memrec.py
  # _evaluate_single_user); warmup writes that build M_u are a separate, unconditional
  # code path and are unaffected by this. Disabling it here prevents ground-truth
  # feedback leaking into shared item memory mid-eval (the same class of bug already
  # caught and fixed for the vanilla baseline), giving a frozen-graph comparison.
  enable_stage_w: false

  pruner:
    mode: llm_rules
    checkpoint: null

  item_weight: 1.0
  user_weight: 0.5
  recency_weight: 0.5
  degree_weight: 0.3
  overlap_weight: 0.7

  reranker_mode: llm

  write:
    fanout_cap: 8
    max_tokens: 4000

parallel_workers: 16
debug: false
