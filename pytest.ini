[pytest]
testpaths = tests

# Put the repo root on sys.path so `from src.rl... import ...` resolves.
#
# Without this, bare `pytest` fails with "No module named 'src'" while
# `python -m pytest` works -- the latter prepends the CWD to sys.path, the former
# does not. tests/rl/ is a package and tests/ is not, so pytest's rootdir walk
# stops at tests/ and inserts that instead of the repo root.
#
# Needs pytest >= 7.0.
pythonpath = .

markers =
    slow: needs the processed dataset on disk; excluded from the <5 min smoke run
